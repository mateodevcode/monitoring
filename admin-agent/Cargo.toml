[package]
name = "admin-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
# ==========================================
# Framework Web y Enrutamiento
# ==========================================
dotenv = "0.15"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
tower_governor = "0.4" # <-- NUEVO: Para rate limiting (protección contra fuerza bruta en login)

# ==========================================
# Runtime Asíncrono y Utilidades
# ==========================================
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
uuid = { version = "1.0", features = ["v4"] }

# ==========================================
# Serialización y Fechas
# ==========================================
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# ==========================================
# Seguridad y Autenticación
# ==========================================
jsonwebtoken = "9"
argon2 = "0.5"
totp-rs = { version = "5", features = ["gen_secret", "qr"] } # Agregué "qr" por si lo necesitas para el generador

# ==========================================
# Cliente HTTP y WebSockets
# ==========================================
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ureq = "2.9"
tokio-tungstenite = "0.23" # Actualizado a 0.23 para mejor compatibilidad con tokio 1.x y axum 0.7

# ==========================================
# Base de Datos y Sistema
# ==========================================
rusqlite = { version = "0.31", features = ["bundled"] }
sysinfo = "0.39.6"
# procfs = "0.16" # Descomentado si lo llegas a necesitar para métricas Linux específicas

# ==========================================
# Logging
# ==========================================
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ==========================================
# Optimización para Producción (Binario pequeño y rápido)
# ==========================================
[profile.release]
opt-level = "z"       # Optimiza por tamaño
lto = true            # Link Time Optimization
codegen-units = 1     # Mejora la optimización a costa de un poco más de tiempo de compilación
panic = 'abort'       # Reduce el tamaño del binario eliminando el manejo de panicos complejo
strip = true          # Elimina símbolos de depuración del binario final