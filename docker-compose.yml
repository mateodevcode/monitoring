services:
  # EL CORAZÓN - solo transporte, agnóstico, sin lógica de negocio
  socket-core:
    build:
      context: ./socket-core
      dockerfile: Dockerfile
    container_name: socket-core
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:3005"
    # Si el frontend necesita WS, Nginx hace proxy hacia este nombre de servicio.
    environment:
      - RUST_LOG=info
    networks:
      - central_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # EL AGENTE - control total del host, por eso va detrás de Tailscale + JWT + OTP
  admin-agent:
    build:
      context: ./admin-agent
      dockerfile: Dockerfile
    container_name: admin-agent
    restart: unless-stopped
    pid: host
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - RUST_LOG=info
      - CORE_WS_URL=ws://socket-core:3005/ws
      - CORE_REST_URL=http://socket-core:3005
      - DB_PATH=/app/data/threats.db
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./admin-agent-data:/app/data
      - /proc:/proc:ro
      - /sys:/sys:ro
        # --- AGREGAR ESTAS DOS LÍNEAS ---
      - /var/run/utmp:/var/run/utmp:ro
      - /var/log/wtmp:/var/log/wtmp:ro
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    networks:
      - central_network

    depends_on:
      socket-core:
        condition: service_healthy

networks:
  central_network:
    external: true
