# Registro de VPS disponibles para el Agente SSH.
# Añadir un VPS nuevo = añadir un bloque [[vps]] aquí y reiniciar el contenedor.
# NO hace falta recompilar Rust.

[[vps]]
id = "vps1"
host = "127.0.0.1"
user = "deploy"
ssh_key_path = "/app/keys/vps1.pem"
port = 22

[vps.commands]
ram = "free -h"
disk = "df -h"
uptime = "uptime"
top_procesos = "ps aux --sort=-%mem | head -10"

