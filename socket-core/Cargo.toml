[package]
name = "socket-core"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
dashmap = "5.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
tower-http = { version = "0.5", features = ["cors"] }

# 🎤 Whisper y procesamiento de audio
whisper-rs = "0.13"
hound = "3.5"
base64 = "0.22"
tempfile = "3"

# 🚀 OPTIMIZACIÓN PARA PRODUCCIÓN (VPS)
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = 'abort'
strip = true

# 🤖 Agente de IA y variables de entorno
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
async-trait = "0.1"
dotenv = "0.15"