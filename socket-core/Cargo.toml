[package]
name = "socket-core"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
dashmap = "5.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
tower-http = { version = "0.5", features = ["cors"] }

# 🚀 OPTIMIZACIÓN PARA PRODUCCIÓN (VPS)
# Esto reduce el tamaño del binario final en un 50-70%
[profile.release]
opt-level = "z"          # Optimizar por tamaño
lto = true               # Link-Time Optimization
codegen-units = 1        # Mejor optimización a costa de tiempo de compilación
panic = 'abort'          # Elimina código de manejo de panic
strip = true             # Elimina símbolos de debug (¡crucial para reducir tamaño!)